{% extends 'layout.html' %}

{% block title %}Editar Usuario{% endblock %}

{% block content %}

<section class="bg-black flex-1 px-8 py-8 text-white">

    <div class="max-w-3xl mx-auto">

        <!-- Cabecera -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-orange-500 uppercase">
                    Editar Usuario
                </h1>
                <p class="text-gray-300 text-sm mt-1">
                    Modifica los datos del usuario seleccionado.
                </p>
            </div>

            <a href="{{ url_for('admin.users') }}"
               class="bg-gray-700 hover:bg-gray-800 text-white font-bold px-4 py-2 rounded-lg transition">
                Volver
            </a>
        </div>

        <!-- Formulario -->
        <div class="bg-black border-4 border-orange-500 rounded-xl shadow-2xl p-8">

            <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}" class="flex flex-col gap-5">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Nombre -->
                <div class="flex flex-col">
                    <label for="name" class="text-orange-400 font-bold mb-2">
                        Nombre
                    </label>

                    <input 
                        type="text" 
                        id="name" 
                        name="name"
                        value="{{ user.name }}"
                        class="bg-gray-900 border border-orange-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="flex flex-col">
                    <label for="email" class="text-orange-400 font-bold mb-2">
                        Email
                    </label>

                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        value="{{ user.email }}"
                        class="bg-gray-900 border border-orange-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                        required
                    >
                </div>

                <!-- Rol -->
                <div class="flex flex-col">
                    <label for="role_id" class="text-orange-400 font-bold mb-2">
                        Rol
                    </label>

                    <select 
                        id="role_id" 
                        name="role_id"
                        class="bg-gray-900 border border-orange-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                        required
                    >
                        {% for role in roles %}
                            <option value="{{ role.id }}"
                                {% if user.role_id == role.id %}
                                    selected
                                {% endif %}
                            >
                                {{ role.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Estado -->
                <div class="flex flex-col">
                    <label for="estado_user" class="text-orange-400 font-bold mb-2">
                        Estado
                    </label>

                    <select 
                        id="estado_user" 
                        name="estado_user"
                        class="bg-gray-900 border border-orange-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                        required
                    >
                        <option value="activo" {% if user.estado == "activo" %}selected{% endif %}>
                            Activo
                        </option>

                        <option value="deshabilitado" {% if user.estado == "deshabilitado" %}selected{% endif %}>
                            Deshabilitado
                        </option>
                    </select>
                </div>

                <!-- Botones -->
                <div class="flex justify-end gap-3 mt-4">
                    <a href="{{ url_for('admin.users') }}"
                       class="bg-gray-700 hover:bg-gray-800 text-white font-bold px-5 py-2 rounded-lg transition">
                        Cancelar
                    </a>

                    <button 
                        type="submit"
                        class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2 rounded-lg transition"
                    >
                        Guardar cambios
                    </button>
                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
