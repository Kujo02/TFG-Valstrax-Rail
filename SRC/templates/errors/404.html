<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }

        .escena-404 {
            position: relative;
            height: 310px;
            overflow: hidden;
            border-radius: 1.5rem 1.5rem 0 0;
            background: linear-gradient(
                to bottom,
                #dbeafe 0%,
                #eff6ff 55%,
                #bfdbfe 55%,
                #93c5fd 100%
            );
        }

        .montanas-404 {
            position: absolute;
            bottom: 95px;
            left: 0;
            width: 100%;
            height: 120px;
            background:
                linear-gradient(135deg, transparent 50%, #bfdbfe 50%) 0 0 / 180px 120px repeat-x;
            opacity: 0.8;
        }

        .suelo-404 {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 95px;
            background: linear-gradient(to bottom, #64748b, #334155);
        }

        .via-404 {
            position: absolute;
            bottom: 58px;
            left: 0;
            width: 100%;
            height: 8px;
            background: #1f2937;
            box-shadow: 0 18px 0 #374151;
            z-index: 2;
        }

        .traviesas-404 {
            position: absolute;
            bottom: 32px;
            left: 0;
            width: 200%;
            height: 35px;
            background: repeating-linear-gradient(
                90deg,
                #78350f 0,
                #78350f 20px,
                transparent 20px,
                transparent 52px
            );
            animation: moverTraviesas 1s linear infinite;
            z-index: 1;
        }

        .tren-404 {
            position: absolute;
            bottom: 62px;
            width: 330px;
            animation: moverTren 7.2s linear infinite;
            z-index: 4;
        }

        .valstrax-404 {
            position: absolute;
            bottom: 105px;
            width: 235px;
            animation: moverValstrax 7.8s linear infinite;
            animation-delay: 0,7s;
            z-index: 5;
        }

        .nube-404 {
            position: absolute;
            top: 42px;
            width: 95px;
            height: 34px;
            background: white;
            border-radius: 999px;
            opacity: 0.9;
            animation: moverNube 18s linear infinite;
            z-index: 1;
        }

        .nube-404::before,
        .nube-404::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 999px;
        }

        .nube-404::before {
            width: 42px;
            height: 42px;
            left: 12px;
            top: -18px;
        }

        .nube-404::after {
            width: 54px;
            height: 54px;
            right: 8px;
            top: -25px;
        }

        .nube-1 {
            left: 15%;
            animation-delay: 0s;
        }

        .nube-2 {
            top: 78px;
            left: 65%;
            transform: scale(0.8);
            animation-delay: -8s;
        }

        @keyframes moverTren {
            0% {
                left: 120%;
                transform: translateY(0);
            }

            50% {
                transform: translateY(1px);
            }

            100% {
                left: -50%;
                transform: translateY(0);
            }
        }

        @keyframes moverValstrax {
            0% {
                left: 165%;
                transform: translateY(0) rotate(-4deg);
            }

            45% {
                transform: translateY(-7px) rotate(3deg);
            }

            100% {
                left: -40%;
                transform: translateY(0) rotate(-4deg);
            }
        }

        @keyframes moverTraviesas {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-52px);
            }
        }

        @keyframes moverNube {
            0% {
                transform: translateX(110vw);
            }

            100% {
                transform: translateX(-45vw);
            }
        }
    </style>
</head>

<body class="bg-blue-950 min-h-screen flex items-center justify-center px-6 py-10">

    <main class="w-full max-w-6xl">

        <section class="bg-white rounded-3xl shadow-2xl overflow-hidden">

            <!-- Animación -->
            <div class="escena-404">

                <div class="nube-404 nube-1"></div>
                <div class="nube-404 nube-2"></div>

                <div class="montanas-404"></div>
                <div class="suelo-404"></div>

                <div class="traviesas-404"></div>
                <div class="via-404"></div>

                <img src="{{ url_for('static', filename='img/tren.png') }}"
                     alt="Tren escapando"
                     class="tren-404">

                <img src="{{ url_for('static', filename='img/valstrax.png') }}"
                     alt="Valstrax persiguiendo el tren"
                     class="valstrax-404">

            </div>

            <!-- Contenido -->
            <div class="px-8 py-10 text-center">

                <p class="text-blue-700 font-extrabold uppercase tracking-widest text-sm">
                    Valstrax Rail
                </p>

                <h1 class="text-8xl font-extrabold text-blue-900 mt-2">
                    404
                </h1>

                <h2 class="text-3xl font-extrabold text-blue-900 uppercase mt-4">
                    Página no encontrada
                </h2>

                <p class="text-gray-600 mt-4 max-w-xl mx-auto">
                    Parece que Valstrax ha salido disparado persiguiendo un tren y esta ruta se ha quedado fuera del mapa.
                </p>

                <div class="flex flex-wrap justify-center gap-4 mt-8">
                    <a href="{{ url_for('main.home') }}"
                       class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-6 py-3 rounded-lg transition">
                        Volver al inicio
                    </a>

                    <a href="{{ url_for('main.reservar') }}"
                       class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-6 py-3 rounded-lg transition">
                        Ver viajes disponibles
                    </a>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
